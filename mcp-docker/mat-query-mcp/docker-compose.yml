services:
  mat-query-mcp:
    build:
      context: ../mcp-sse-router
      dockerfile: Dockerfile
    image: mcp-sse-router
    container_name: mat-query-mcp
    depends_on:
    - mat-query-mcp-backend-1
    ports:
    - ${HOST_PORT}:${SERVER_PORT}
    environment:
    - SERVER_HOST=${SERVER_HOST}
    - SERVER_PORT=${SERVER_PORT}
    - LOG_LEVEL=${LOG_LEVEL}
    - SERVICE_NAME=mat-query-mcp
    - BACKEND_URLS=http://mat-query-mcp-backend-1:${SERVER_PORT},http://mat-query-mcp-backend-2:${SERVER_PORT}
    - BACKEND_HEALTH_PATH=/health
    - BACKEND_SSE_PATH=/sse
    - BACKEND_MESSAGE_PATH=/messages/
    - PUBLIC_SSE_PATH=/sse
    - PUBLIC_MESSAGE_PATH=/messages/
    - PUBLIC_HEALTH_PATH=/health
    restart: unless-stopped
    healthcheck:
      test: &id001
      - CMD
      - python
      - -c
      - import os, urllib.request; urllib.request.urlopen('http://localhost:' + os.environ.get('SERVER_PORT',
        '5667') + '/health')
      interval: 300s
      timeout: 10s
      retries: 3
      start_period: 20s
  mat-query-mcp-backend-1:
    build:
      context: .
      dockerfile: Dockerfile
    image: mat-query-mcp:latest
    environment:
    - MP_API_KEY=${MP_API_KEY}
    - LOCAL_MP_CIF_ROOT=${LOCAL_MP_CIF_ROOT}
    - LOCAL_MP_PROPS_ROOT=${LOCAL_MP_PROPS_ROOT}
    - SERVER_HOST=${SERVER_HOST}
    - SERVER_PORT=${SERVER_PORT}
    - MP_TOPK=${MP_TOPK}
    - TOOL_CALL_TIMEOUT=${TOOL_CALL_TIMEOUT}
    - LOG_LEVEL=${LOG_LEVEL}
    - PYTHONUNBUFFERED=${PYTHONUNBUFFERED}
    volumes:
    - ${HOST_MP_CIF_ROOT}:${LOCAL_MP_CIF_ROOT}:ro
    - ${HOST_MP_PROPS_ROOT}:${LOCAL_MP_PROPS_ROOT}:ro
    - ./logs:/app/logs
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test: *id001
      interval: 300s
      timeout: 10s
      retries: 3
      start_period: 40s
    security_opt:
    - no-new-privileges:true
    read_only: true
    tmpfs:
    - /tmp:noexec,nosuid,size=100m
  mat-query-mcp-backend-2:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
    - MP_API_KEY=${MP_API_KEY}
    - LOCAL_MP_CIF_ROOT=${LOCAL_MP_CIF_ROOT}
    - LOCAL_MP_PROPS_ROOT=${LOCAL_MP_PROPS_ROOT}
    - SERVER_HOST=${SERVER_HOST}
    - SERVER_PORT=${SERVER_PORT}
    - MP_TOPK=${MP_TOPK}
    - TOOL_CALL_TIMEOUT=${TOOL_CALL_TIMEOUT}
    - LOG_LEVEL=${LOG_LEVEL}
    - PYTHONUNBUFFERED=${PYTHONUNBUFFERED}
    healthcheck:
      interval: 300s
      retries: 3
      start_period: 40s
      test: *id001
      timeout: 10s
    image: mat-query-mcp:latest
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
    read_only: true
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    tmpfs:
    - /tmp:noexec,nosuid,size=100m
    volumes:
    - ${HOST_MP_CIF_ROOT}:${LOCAL_MP_CIF_ROOT}:ro
    - ${HOST_MP_PROPS_ROOT}:${LOCAL_MP_PROPS_ROOT}:ro
    - ./logs:/app/logs
networks:
  default:
    name: mat-query-mcp-network
