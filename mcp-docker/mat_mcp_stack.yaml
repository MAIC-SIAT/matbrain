# Machine-readable Mat-MCP stack inventory.
#
# enabled=true means the service is part of the current Mat-T1/Mat-R1 tool
# configs under train/rl/tool_configs. Extra services are kept here so Docker
# orchestration can include them explicitly when needed.
services:
  - name: matgl-mcp
    directory: matgl-mcp
    port: 5668
    sse_path: /sse
    health_path: /health
    enabled: true
    gpu: true
    replicas_smoke: 4
    replicas_production32: 8
    replicas_production128: 32
    concurrency_cap_smoke: 4
    concurrency_cap_production32: 8
    concurrency_cap_production128: 32
    gpu_devices: ["0", "1", "2", "3"]

  - name: crystallm-mcp
    directory: crystallm-mcp
    port: 5669
    sse_path: /sse
    health_path: /health
    enabled: true
    gpu: true
    replicas_smoke: 4
    replicas_production32: 8
    replicas_production128: 12
    concurrency_cap_smoke: 4
    concurrency_cap_production32: 8
    concurrency_cap_production128: 12
    gpu_devices: ["1"]

  - name: pymatgen-mcp
    directory: pymatgen-mcp
    port: 5672
    sse_path: /pymatgen/sse
    health_path: /pymatgen/health
    enabled: true
    replicas_smoke: 4
    replicas_production32: 8
    replicas_production128: 64
    concurrency_cap_smoke: 6
    concurrency_cap_production32: 12
    concurrency_cap_production128: 64
    depends_on:
      - matgl-mcp

  - name: smact-mcp
